<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Air Quality Dashboard — Dhaka Region</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0d1420;--panel:#141d2b;--card:#172232;--ink:#e9eff6;--mut:#8ea0b5;--line:#253444;--accent:#4da3ff;--hot:#e4572e;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
header h1{margin:0;font-size:22px;font-weight:680;letter-spacing:-.01em;}
header p{margin:5px 0 0;color:var(--mut);font-size:13px;}
.metricsel{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:12px;}
.msel{border:none;background:transparent;color:var(--mut);font-size:14px;font-weight:650;padding:8px 20px;border-radius:8px;cursor:pointer;transition:.15s;}
.msel.active{background:var(--accent);color:#04121f;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:22px 0;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);}
.kpi .val{font-size:22px;font-weight:700;margin-top:4px;}
.kpi .sub{font-size:11px;color:var(--mut);margin-top:2px;}
.kpi.hot .val{color:var(--hot);} .kpi.cool .val{color:var(--accent);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.panel.wide{grid-column:1/-1;}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.panel h3{margin:0 0 3px;font-size:14px;font-weight:650;}
.panel .cap{margin:0 0 12px;font-size:11.5px;color:var(--mut);}
.toggle{display:flex;gap:4px;flex-shrink:0;}
.tbtn{border:1px solid #33475a;background:#1d2836;color:var(--mut);font-size:10.5px;padding:3px 9px;border-radius:6px;cursor:pointer;}
.tbtn.active{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:650;}
.chart-box{position:relative;height:280px;}
.heat{display:grid;grid-template-columns:80px repeat(12,1fr);gap:3px;font-size:10.5px;}
.heat .hh{color:var(--mut);text-align:center;padding:3px 0;}
.heat .rl{color:var(--mut);display:flex;align-items:center;font-size:11px;}
.heat .cell{aspect-ratio:1.4;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#08121c;font-weight:600;font-size:9.5px;}
#map,#jmap{height:440px;border-radius:12px;overflow:hidden;}
#jmap{height:520px;}
.mapctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.mbtn{border:1px solid #33475a;background:#1d2836;color:var(--ink);font-size:11.5px;padding:4px 8px;border-radius:6px;cursor:pointer;}
.mbtn.active{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:650;}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1b2632;color:var(--ink);}
.pp b{color:var(--accent);}
.ctrlab{background:rgba(13,20,32,.82);border:1px solid #4da3ff;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:650;color:#fff;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.ctrlab small{color:#9fd0ff;font-weight:500;}
.xhair{color:#fff;font-size:16px;text-shadow:0 0 3px #000;line-height:1;}
.lgbar{height:11px;border-radius:6px;background:linear-gradient(90deg,#2b83ba,#7fcdbb,#ffffbf,#fdae61,#d7191c);}
.lgsc{display:flex;justify-content:space-between;color:var(--mut);font-size:10px;margin-top:3px;}
.note{color:var(--mut);font-size:11.5px;margin-top:22px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px;}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr);}.grid{grid-template-columns:1fr;}}
</style></head>
<body><div class="wrap">
<div class="topbar">
  <header><h1 id="h1"></h1><p id="sub"></p></header>
  <div class="metricsel"><button class="msel active" data-m="AOD">AOD</button><button class="msel" data-m="SO2">SO₂</button></div>
</div>

<div class="kpis" id="kpis"></div>

<div class="grid">
  <div class="panel"><h3 id="t_month"></h3><p class="cap" id="c_month"></p><div class="chart-box"><canvas id="cMonth"></canvas></div></div>
  <div class="panel"><h3>Year-on-year trend</h3><p class="cap" id="c_year"></p><div class="chart-box"><canvas id="cYear"></canvas></div></div>
  <div class="panel"><h3>Cluster comparison</h3><p class="cap" id="c_cl"></p><div class="chart-box"><canvas id="cCluster"></canvas></div></div>
  <div class="panel">
    <div class="phead"><div><h3>Distance gradient</h3><p class="cap" id="distCap"></p></div>
      <div class="toggle"><button class="tbtn active" data-v="cluster">By cluster</button><button class="tbtn" data-v="direction">By direction</button></div></div>
    <div class="chart-box"><canvas id="cDist"></canvas></div></div>
  <div class="panel wide"><h3>Cluster × month heatmap</h3><p class="cap" id="c_heat"></p><div id="heat" class="heat"></div></div>
  <div class="panel"><h3>Value distribution</h3><p class="cap">Histogram of all observations</p><div class="chart-box"><canvas id="cHist"></canvas></div></div>
  <div class="panel"><h3>Cluster trajectories</h3><p class="cap" id="c_traj"></p><div class="chart-box"><canvas id="cCY"></canvas></div></div>

  <div class="panel wide">
    <h3 id="t_jmap"></h3>
    <p class="cap" id="c_jmap"></p>
    <div class="mapctl"><span id="jbtns"></span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--mut)">Showing: <b id="jmonth" style="color:var(--accent)"></b></span></div>
    <div id="jmap"></div>
    <div style="margin-top:8px;max-width:300px"><div class="lgbar"></div><div class="lgsc"><span id="jvmin"></span><span id="jlab"></span><span id="jvmax"></span></div>
      <div style="font-size:10px;color:var(--mut);margin-top:2px">Scale fixed across all months for comparison</div></div>
  </div>

  <div class="panel wide">
    <h3>Spatial concentration map (points)</h3><p class="cap" id="c_pmap"></p>
    <div class="mapctl"><span id="mbtns"></span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--mut)">Region avg: <b id="mavg" style="color:var(--accent)"></b></span></div>
    <div id="map"></div>
    <div style="margin-top:8px;max-width:280px"><div class="lgbar"></div><div class="lgsc"><span id="lvmin"></span><span id="plab"></span><span id="lvmax"></span></div></div>
  </div>
</div>
<div class="note" id="note"></div>
</div>

function mkcol(a,b){return v=>{let t=(v-a)/(b-a);t=Math.max(0,Math.min(1,t));let s=t*4,i=Math.floor(s),f=s-i;if(i>=4)return`rgb(${STOPS[4].join(',')})`;let p=STOPS[i],q=STOPS[i+1],c=p.map((x,k)=>Math.round(x+(q[k]-x)*f));return`rgb(${c.join(',')})`;};}

let cur='AOD',distMode='cluster',cm=6,jm=6;
const charts={};let jmap,pmap,jLayers=[],pLayers=[];
function fmt(v,dec){dec=dec??META[cur].decimals;return v==null?'–':(+v).toFixed(dec);}
function M(){return ALL[cur];}
const legendOpts={display:true,labels:{boxWidth:12,font:{size:10},usePointStyle:true}};
const uAxis=()=>META[cur].unit;
const multiOpts=(xt)=>({responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
  plugins:{legend:legendOpts},scales:{x:{grid:{color:GRID},title:{display:!!xt,text:xt}},y:{grid:{color:GRID},title:{display:true,text:uAxis()}}}});
const baseOpts=(yt)=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
  scales:{x:{grid:{color:GRID}},y:{grid:{color:GRID},title:{display:!!yt,text:yt}}}});
function clusterSets(obj){return M().clusters.map(c=>({label:c,data:obj[c],borderColor:CCOL[c],backgroundColor:CCOL[c],borderWidth:2,tension:.35,pointRadius:3,pointHoverRadius:5}));}
function dirSets(){return M().dir_labels.map(dr=>({label:dr,data:M().dir_distance[dr],borderColor:DCOL[dr],backgroundColor:DCOL[dr],borderWidth:2,tension:.35,pointRadius:3,pointHoverRadius:5}));}

function renderCharts(){
  const m=M(),col=mkcol(m.vmin,m.vmax);
  Object.values(charts).forEach(c=>c.destroy());
  charts.month=new Chart(cMonth,{type:'line',data:{labels:MN,datasets:clusterSets(m.cluster_month)},options:multiOpts()});
  charts.year=new Chart(cYear,{type:'line',data:{labels:m.years,datasets:[{data:m.yearly,borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,.12)',borderWidth:2.5,fill:true,tension:.3,pointRadius:4,pointBackgroundColor:'#22c55e'}]},options:baseOpts(uAxis())});
  charts.cl=new Chart(cCluster,{type:'bar',data:{labels:m.clusters,datasets:[{data:m.cluster_mean,backgroundColor:m.clusters.map(c=>CCOL[c]),borderRadius:6}]},options:baseOpts(uAxis())});
  charts.dist=new Chart(cDist,{type:'line',data:{labels:m.distance.map(x=>x+' km'),datasets:distMode==='direction'?dirSets():clusterSets(m.cluster_distance)},options:multiOpts('Distance from centre')});
  const hl=m.hist.edges.slice(0,-1).map(e=>(+e).toFixed(2));
  charts.hist=new Chart(cHist,{type:'bar',data:{labels:hl,datasets:[{data:m.hist.counts,backgroundColor:m.hist.edges.slice(0,-1).map(e=>col(e)),borderRadius:3}]},options:{...baseOpts('count'),scales:{x:{grid:{color:GRID},title:{display:true,text:META[cur].short+' bin'}},y:{grid:{color:GRID}}}}});
  charts.cy=new Chart(cCY,{type:'line',data:{labels:m.years,datasets:clusterSets(m.cluster_year)},options:multiOpts()});
  let hh='<div></div>'+MN.map(x=>`<div class="hh">${x}</div>`).join('');
  m.clusters.forEach(c=>{hh+=`<div class="rl">${c}</div>`;m.cluster_month[c].forEach(v=>{hh+=`<div class="cell" style="background:${col(v)}" title="${c} ${fmt(v)}">${fmt(v)}</div>`;});});
  document.getElementById('heat').innerHTML=hh;
}

function renderJMap(){
  const m=M(),G=m.grids,col=mkcol(G.vmin,G.vmax),z=G.months[jm];
  jLayers.forEach(l=>jmap.removeLayer(l));jLayers=[];
  const cv=document.createElement('canvas');cv.width=G.nlon;cv.height=G.nlat;
  const ctx=cv.getContext('2d'),img=ctx.createImageData(G.nlon,G.nlat);
  for(let r=0;r<G.nlat;r++){const gi=G.nlat-1-r;for(let c=0;c<G.nlon;c++){const rgb=col(z[gi*G.nlon+c]).match(/\d+/g);const o=(r*G.nlon+c)*4;img.data[o]=+rgb[0];img.data[o+1]=+rgb[1];img.data[o+2]=+rgb[2];img.data[o+3]=200;}}
  ctx.putImageData(img,0,0);
  const up=document.createElement('canvas');up.width=G.nlon*8;up.height=G.nlat*8;const uc=up.getContext('2d');uc.imageSmoothingEnabled=true;uc.imageSmoothingQuality='high';uc.drawImage(cv,0,0,up.width,up.height);
  jLayers.push(L.imageOverlay(up.toDataURL(),[[G.lat0,G.lon0],[G.lat1,G.lon1]],{opacity:.72}).addTo(jmap));
  m.clusters.forEach((name,idx)=>{const c=m.centers[name];const cv=m.cluster_month[name][jm-1];
    jLayers.push(L.marker([c.lat,c.lon],{icon:L.divIcon({className:'',html:'<div class="xhair">✚</div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(jmap));
    jLayers.push(L.marker([c.lat,c.lon],{icon:L.divIcon({className:'',html:`<div class="ctrlab">${name} <small>${MN[jm-1]} ${fmt(cv)}</small></div>`,iconSize:[10,10],iconAnchor:[-10,8]})}).addTo(jmap));
  });
  jvmin.textContent=fmt(G.vmin);jvmax.textContent=fmt(G.vmax);jlab.textContent=META[cur].short;
  jmonth.textContent=MF[jm-1];
}

function renderPMap(){
  const m=M(),col=mkcol(m.vmin,m.vmax);
  pLayers.forEach(l=>pmap.removeLayer(l));pLayers=[];let s=0,n=0;
  function rad(v){let t=(v-m.vmin)/(m.vmax-m.vmin);t=Math.max(0,Math.min(1,t));return 4+t*8;}
  for(const[pid,p]of Object.entries(m.points)){const v=p.months[cm];if(v==null)continue;s+=v;n++;
    const c=L.circleMarker([p.lat,p.lon],{radius:rad(v),fillColor:col(v),color:'#0a1119',weight:.6,fillOpacity:.82});
    c.bindPopup(`<div class="pp"><b>${pid}</b><br>${p.cluster}<br>${META[cur].short} (${MF[cm-1]}): <b>${fmt(v)}</b></div>`);c.addTo(pmap);pLayers.push(c);}
  mavg.textContent=n?fmt(s/n):'–';
  lvmin.textContent=fmt(m.vmin);lvmax.textContent=fmt(m.vmax);plab.textContent=META[cur].short;
}

function renderText(){
  const m=M(),mt=META[cur],K=m.kpi;
  document.getElementById('h1').innerHTML=mt.label+' — Air Quality Dashboard';
  document.getElementById('sub').innerHTML=`Greater Dhaka region · ${K.npoints} points · ${K.nclusters} clusters · ${K.nobs.toLocaleString()} observations · ${K.yr_start}–${K.yr_end}`;
  const kp=[
   ['Overall mean',fmt(K.overall)+mt.value_kpi_unit,'median '+fmt(K.median),''],
   ['Peak month',K.peak_month,'avg '+fmt(K.peak_val),'hot'],
   ['Lowest month',K.clean_month,'avg '+fmt(K.clean_val),'cool'],
   ['Monitoring points',K.npoints,K.nclusters+' clusters',''],
   ['Observations',K.nobs.toLocaleString(),mt.source,''],
   ['Max recorded',fmt(K.max),'single reading','hot'],
  ];
  document.getElementById('kpis').innerHTML=kp.map(k=>`<div class="kpi ${k[3]}"><div class="lab">${k[0]}</div><div class="val">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join('');
  t_month.textContent='Seasonal cycle by cluster';
  c_month.textContent='Mean '+mt.short+' by calendar month, one curve per cluster';
  c_year.textContent='Region-wide annual mean '+mt.short;
  c_cl.textContent='Overall mean '+mt.short+' by monitoring cluster';
  c_heat.textContent='Mean '+mt.short+' per cluster per month — darker red = higher';
  c_traj.textContent='Annual mean '+mt.short+' per cluster over time';
  distCap.textContent=distMode==='direction'?'Mean '+mt.short+' vs. distance (km), by compass direction (all clusters)':'Mean '+mt.short+' vs. distance from centre (km), by cluster';
  t_jmap.textContent='Concentration gradient — interpolated surface (any month)';
  c_jmap.innerHTML='IDW-interpolated '+mt.short+' field across the whole study area — pick a month. ✚ marks each cluster centre (with that month’s mean).';
  c_pmap.textContent='164 points coloured by monthly '+mt.short+' — select a month';
  document.getElementById('note').innerHTML=`<b>Reading the data.</b> ${cur==='AOD'?'AOD (Aerosol Optical Depth) is a proxy for column aerosol loading — higher = hazier, more polluted air.':'SO₂ column density (mmol/m², from TROPOMI) tracks sulphur-dioxide pollution. Retrievals are noisy: ~37% of individual pixels are slightly negative, so low monthly means (esp. monsoon) can dip below zero — this is instrument noise, not negative concentration.'} Values are averaged by calendar month across ${K.yr_start}–${K.yr_end}. Interpolated surfaces use inverse-distance weighting (power 2); the surface colour scale is fixed across all 12 months so they are directly comparable, and clipped to the 2–98th percentile so outliers don't wash out the map.`;
}

function renderAll(){renderText();renderCharts();renderJMap();renderPMap();}

// point-map month buttons
const mb=document.getElementById('mbtns');
MN.forEach((m,i)=>{const b=document.createElement('button');b.className='mbtn'+(i==5?' active':'');b.textContent=m;b.onclick=()=>{cm=i+1;[...mb.children].forEach((x,j)=>x.classList.toggle('active',j==i));renderPMap();};mb.appendChild(b);});
// gradient-map month buttons
const jb=document.getElementById('jbtns');
MN.forEach((m,i)=>{const b=document.createElement('button');b.className='mbtn'+(i==5?' active':'');b.textContent=m;b.onclick=()=>{jm=i+1;[...jb.children].forEach((x,j)=>x.classList.toggle('active',j==i));renderJMap();};jb.appendChild(b);});
// distance toggle
document.querySelectorAll('.toggle .tbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toggle .tbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');distMode=b.dataset.v;charts.dist.data.datasets=distMode==='direction'?dirSets():clusterSets(M().cluster_distance);distCap.textContent=distMode==='direction'?'Mean '+META[cur].short+' vs. distance (km), by compass direction (all clusters)':'Mean '+META[cur].short+' vs. distance from centre (km), by cluster';charts.dist.update();});
// metric selector
document.querySelectorAll('.msel').forEach(b=>b.onclick=()=>{if(cur===b.dataset.m)return;document.querySelectorAll('.msel').forEach(x=>x.classList.remove('active'));b.classList.add('active');cur=b.dataset.m;renderAll();});

jmap=L.map('jmap').setView([23.83,90.38],10);
L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{subdomains:['mt0','mt1','mt2','mt3'],maxZoom:20,attribution:'© Google'}).addTo(jmap);
pmap=L.map('map',{zoomControl:true}).setView([23.83,90.38],10);
L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{subdomains:['mt0','mt1','mt2','mt3'],maxZoom:20,attribution:'© Google'}).addTo(pmap);
renderAll();
</script>
